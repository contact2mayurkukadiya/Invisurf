<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
        }
        .dl-arrow-container {
            display: none;
            width: 64px;
            height: 64px;
            position: absolute;
            left: 50%;
            margin-left: -32px;
            top: 10px;
            align-items: center;
            justify-content: center;
        }
        .dl-arrow-container.animating {
            display: flex;
            animation: arrowFlyUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .dl-arrow-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 4px 14px rgba(26, 115, 232, 0.75)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        }
        .dl-arrow-icon svg {
            width: 56px;
            height: 56px;
        }
        @keyframes arrowFlyUp {
            0% {
                opacity: 0;
                transform: translateY(160px) scale(0.6);
            }
            18% {
                opacity: 1;
                transform: translateY(70px) scale(1.15);
            }
            38% {
                opacity: 1;
                transform: translateY(28px) scale(1.0);
            }
            68% {
                opacity: 0.95;
                transform: translateY(2px) scale(0.65);
            }
            100% {
                opacity: 0;
                transform: translateY(-16px) scale(0.2);
            }
        }
    </style>
</head>
<body>
    <div id="arrow-container" class="dl-arrow-container">
        <div class="dl-arrow-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5" />
                <polyline points="5 12 12 5 19 12" />
            </svg>
        </div>
    </div>
    <script>
        const container = document.getElementById('arrow-container');
        function triggerAnim() {
            container.classList.remove('animating');
            void container.offsetWidth;
            container.classList.add('animating');
        }
        if (window.electronAPI && window.electronAPI.onDownloadAttentionPlay) {
            window.electronAPI.onDownloadAttentionPlay(triggerAnim);
        }
        window.addEventListener('message', (e) => {
            if (e.data === 'play') triggerAnim();
        });
    </script>
</body>
</html>
