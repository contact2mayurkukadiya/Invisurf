<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 6px 8px;
            box-sizing: border-box;
            width: 100vw;
            min-height: 100vh;
        }

        .tab-tooltip {
            display: none;
            background: #ffffff;
            color: #202124;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.20), 0 0 0 1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            pointer-events: none;
        }

        .tab-tooltip--visible {
            display: block;
        }

        .tab-tooltip__title {
            font-size: 13px;
            font-weight: 600;
            color: #202124;
            line-height: 1.4;
            /* Clamp to two lines, matching Chrome behaviour */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .tab-tooltip__url {
            font-size: 11.5px;
            color: #5f6368;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            display: block;
        }

        @media (prefers-color-scheme: dark) {
            .tab-tooltip {
                background: #292a2d;
                color: #e8eaed;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
            }

            .tab-tooltip__title {
                color: #e8eaed;
            }

            .tab-tooltip__url {
                color: #9aa0a6;
            }
        }
    </style>
</head>

<body>
    <div id="tooltip" class="tab-tooltip">
        <div id="tooltip-title" class="tab-tooltip__title"></div>
        <div id="tooltip-url" class="tab-tooltip__url"></div>
    </div>

    <script>
        const tooltipEl = document.getElementById('tooltip');
        const titleEl   = document.getElementById('tooltip-title');
        const urlEl     = document.getElementById('tooltip-url');

        function formatDisplayUrl(rawUrl) {
            if (!rawUrl) return '';
            const trimmed = String(rawUrl).trim();
            // For internal pages, return a friendly label instead of the raw app:// URL
            if (trimmed.startsWith('app://') || trimmed.startsWith('file://')) {
                return '';
            }
            try {
                const parsed = new URL(trimmed);
                // Show host + path (trim trailing slash on root pages)
                const path = parsed.pathname === '/' ? '' : parsed.pathname;
                return parsed.hostname + path;
            } catch {
                return trimmed;
            }
        }

        if (window.electronAPI && window.electronAPI.onTooltipUpdate) {
            window.electronAPI.onTooltipUpdate((data) => {
                if (!data) {
                    tooltipEl.classList.remove('tab-tooltip--visible');
                    tooltipEl.style.display = '';
                    return;
                }

                const rawTitle = (data.title || '').trim();
                titleEl.textContent = rawTitle || 'New Tab';

                const displayUrl = formatDisplayUrl(data.url);
                if (displayUrl) {
                    urlEl.textContent = displayUrl;
                    urlEl.style.display = 'block';
                } else {
                    urlEl.textContent = '';
                    urlEl.style.display = 'none';
                }

                tooltipEl.classList.add('tab-tooltip--visible');
            });
        }
    </script>
</body>

</html>
